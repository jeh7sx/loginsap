<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Médico - Login SAP</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            color: #005a9e;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        small {
            color: #666;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #005a9e;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #003e6d;
        }

        .toggle {
            text-align: center;
            margin-top: 15px;
            cursor: pointer;
            color: #555;
            text-decoration: underline;
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="box-login">
            <h2>Login</h2>

            <input type="text" id="lLogin" placeholder="CPF ou Email">
            <small>Digite seu CPF (somente números) ou email</small>

            <input type="password" id="lPass" placeholder="Senha">

            <button onclick="logar()">Entrar</button>

            <div class="toggle" onclick="swap()">Criar conta</div>
        </div>

        <div id="box-cad" class="hidden">
            <h2>Cadastro</h2>

            <input type="text" id="cCpf" placeholder="CPF">
            <small>Somente números (11 dígitos)</small>

            <input type="email" id="cEmail" placeholder="Email">
            <small>Ex: seuemail@gmail.com</small>

            <input type="text" id="cNome" placeholder="Nome completo">

            <input type="password" id="cPass" placeholder="Senha">
            <small>Mínimo 6 caracteres com maiúscula, minúscula, número e especial</small>

            <button onclick="cadastrar()">Cadastrar</button>

            <div class="toggle" onclick="swap()">Voltar para login</div>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        const msg = document.getElementById('msg');

        function swap() {
            document.getElementById('box-login').classList.toggle('hidden');
            document.getElementById('box-cad').classList.toggle('hidden');
            msg.innerText = "";
        }

        // CPF máscara (somente números)
        document.getElementById('cCpf').addEventListener('input', function (e) {
            let valor = e.target.value.replace(/\D/g, '');
            if (valor.length > 11) valor = valor.slice(0, 11);
            e.target.value = valor;
        });

        function validarCadastro(cpf, email, nome, senha) {
            if (!cpf || !email || !nome || !senha) {
                return "Preencha todos os campos.";
            }

            if (cpf.length !== 11) {
                return "CPF deve ter 11 números.";
            }

            const senhaRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{6,}$/;

            if (!senhaRegex.test(senha)) {
                return "Senha fraca. Use maiúscula, minúscula, número e especial.";
            }

            return null;
        }

        async function cadastrar() {
            const cpf = document.getElementById('cCpf').value;
            const email = document.getElementById('cEmail').value;
            const nome = document.getElementById('cNome').value;
            const senha = document.getElementById('cPass').value;

            const erro = validarCadastro(cpf, email, nome, senha);

            if (erro) {
                msg.style.color = "red";
                msg.innerText = erro;
                return;
            }

            const payload = {
                Cpf: cpf,
                Email: email,
                Nome: nome,
                Senha: senha
            };

            msg.style.color = "blue";
            msg.innerText = "Cadastrando...";

            try {
                const res = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Cadastro realizado com sucesso!");
                    swap();
                } else {
                    msg.style.color = "red";
                    msg.innerText = data.error?.message?.value || JSON.stringify(data.error);
                }

            } catch {
                msg.style.color = "red";
                msg.innerText = "Erro na comunicação.";
            }
        }

        async function logar() {
            const login = document.getElementById('lLogin').value;
            const senha = document.getElementById('lPass').value;

            if (!login || !senha) {
                msg.style.color = "red";
                msg.innerText = "Preencha todos os campos.";
                return;
            }

            msg.style.color = "blue";
            msg.innerText = "Verificando...";

            try {
                const res = await fetch(`/api/login/${login}`);
                const data = await res.json();

                if (!res.ok) {
                    msg.style.color = "red";
                    msg.innerText = "Usuário não encontrado.";
                    return;
                }

                if (data.Senha.trim() === senha.trim()) {
                    msg.style.color = "green";
                    msg.innerText = "Login realizado!";
                
                    // 💾 salva usuário
                    localStorage.setItem("usuario", JSON.stringify(data));
                
                    window.location.href = "home.html";
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Senha incorreta.";
                }

            } catch {
                msg.style.color = "red";
                msg.innerText = "Erro na conexão.";
            }
        }
    </script>

</body>
</html>
